name: Theme check

on:
  push:
  pull_request:

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Shopify theme check
        run: npx --yes @shopify/cli@latest theme check --fail-level error
